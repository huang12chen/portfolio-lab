# Include this server block inside an existing nginx http context.
# Keep the installation's MIME configuration and your existing TLS configuration.
# Replace the reserved hostname and document root before enabling.
server {
    listen 80;
    server_name portfolio.example;
    root /var/www/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
