name: Improvement / 改进建议
description: Describe a concrete need / 描述具体需求
body:
  - type: textarea
    id: need
    attributes:
      label: Task and current difficulty / 任务与当前困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement and example / 建议与示例
      description: For a reference, link the exact case or component and describe what you observed.
    validations:
      required: true
